name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: latest # most recent stable

      - name: Check formatting
        run: zig fmt --check .

  test:
    name: Test / Zig ${{ matrix.zig-version }} / ${{ matrix.os}}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow-fail }}
    strategy:
      matrix:
        zig-version: [0.16.0]
        os: [ubuntu-latest, macos-latest, windows-latest]
        allow-fail: [true]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install kcov
        if: matrix.os == 'ubuntu-latest'
        run: |
          URL=https://github.com/SimonKagstrom/kcov/releases/download/$KCOV_VERSION/kcov-amd64.tar.gz
          curl -L "$URL" | sudo tar xvzf - -C /
        env:
          KCOV_VERSION: v42

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ matrix.zig-version }}

      - name: Run tests
        run: |
          zig build test -freference-trace --summary all
          zig build test -freference-trace --summary all -Doptimize=ReleaseSafe
          zig build test -freference-trace --summary all -Doptimize=ReleaseSmall
          zig build test -freference-trace --summary all -Doptimize=ReleaseFast
