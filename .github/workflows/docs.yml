name: API Reference

on:
  push:
    branches: [main]

  # Allow manually starting the workflow.
  workflow_dispatch:

# If two concurrent runs are started,
# prefer the latest one.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

  build:
    name: Build website
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2
      with:
        version: master
    - name: Build
      run: zig build docs
    - name: Upload
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
      with:
        path: "zig-out/docs/"

  publish:
    name: Publish website
    runs-on: ubuntu-latest
    needs: build  # wait for build to finish
    permissions:
      # Request sufficient permissions to publish the website.
      pages: write
      id-token: write
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
